name: build-livecd-image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v14
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: build LiveCD
        run: |
          nix run nixpkgs#nixos-rebuild -- build-image --image-variant iso --flake .#iso
      - uses: actions/upload-artifact@v7
        with:
          path: ./result/*
          overwrite: true
          retention-days: 7days
