name: build-livecd-image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
      - name: Cachix
        uses: cachix/cachix-action@v17
        with:
          name: fufu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: build LiveCD
        run: |
          nix run nixpkgs#nixos-rebuild -- build-image --image-variant iso --flake .#iso
      - uses: actions/upload-artifact@v7
        with:
          path: ./result/*
          overwrite: true
          retention-days: 7days
