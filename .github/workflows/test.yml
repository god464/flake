on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: cachix/cachix-action@v14
        with:
          name: fufu
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Check flake
        run: nix flake check --no-build
      - name: Build laptop
        run: nix build .#nixosConfigurations.laptop.config.system.build.toplevel
      - name: Build server
        run: nix build .#nixosConfigurations.server.config.system.build.toplevel
      - name: Build minimal
        run: nix build .#nixosConfigurations.minimal.config.system.build.toplevel
      - name: Build devShell
        run: nix build .#devShells.x86_64-linux.default
