name: Auto Merge
on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: |
      github.event.label.name == 'dependencies' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch
