name: automerge
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  workflow_run:
    workflows: ['Build Check']
    types:
      - completed
  check_suite:
    types:
      - completed
  status: {}
jobs:
  automerge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: automerge
        name: automerge
        uses: 'pascalgn/automerge-action@v0.16.4'
        env:
          MERGE_LABELS: 'dependencies'
          MERGE_METHOD: 'squash'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
